name: Build and Test

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"
  workflow_dispatch:

jobs:
  plugin-builder:
    name: Plugin Builder SDK compatibility
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0.400-noble
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Verify the Plugin Builder SDK
        run: test "$(dotnet --version)" = "10.0.400"
      - name: Publish with the Plugin Builder SDK
        run: dotnet publish Plugins/Zano/BTCPayServer.Plugins.Zano.csproj -c Release -o plugin-artifacts -p:ContinuousIntegrationBuild=true
      - name: Check the plugin output boundary
        run: |
          test -f plugin-artifacts/BTCPayServer.Plugins.Zano.dll
          test ! -f plugin-artifacts/BTCPayServer.dll
          test ! -f plugin-artifacts/NBitcoin.dll
      - name: Run unit tests with the Plugin Builder SDK
        run: dotnet test --project BTCPayServer.Plugins.UnitTests/BTCPayServer.Plugins.UnitTests.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-builder-sdk400
          path: plugin-artifacts

  build:
    runs-on: ubuntu-latest
    steps:

    - name: Initialize and update submodules
      uses: actions/checkout@v6
      with:
        submodules: recursive
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Clean project
      run: dotnet clean

    - name: Build projects
      run: dotnet build -maxcpucount:1 -c Release --no-restore -p:ContinuousIntegrationBuild=true

    - name: Deterministic build check
      run: |
        dotnet tool install --global dotnet-validate --version 0.0.1-preview.537 --allow-roll-forward
        dotnet pack Plugins/Zano/BTCPayServer.Plugins.Zano.csproj -c Release --no-build -o nuget-packages
        dotnet validate package local nuget-packages/BTCPayServer.Plugins.Zano.*.nupkg

    - name: Run unit tests
      run: dotnet test --project BTCPayServer.Plugins.UnitTests/BTCPayServer.Plugins.UnitTests.csproj -c Release --no-build --no-restore --coverlet --coverlet-include "[BTCPayServer.Plugins.Zano]*" --coverlet-output-format cobertura --results-directory coverage/unit

    - name: Run integration tests
      run: docker compose -f BTCPayServer.Plugins.IntegrationTests/docker-compose.yml run tests

    - name: Cleanup Docker containers
      if: always()
      run: docker compose -f BTCPayServer.Plugins.IntegrationTests/docker-compose.yml down -v

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/**/coverage.cobertura*.xml

    - name: Upload NuGet package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package-${{ github.sha }}
        path: nuget-packages/BTCPayServer.Plugins.Zano.*.nupkg