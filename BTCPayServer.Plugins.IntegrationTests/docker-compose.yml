services:
  tests:
    build:
      context: ..
      dockerfile: BTCPayServer.Plugins.IntegrationTests/Dockerfile
    environment:
      BTCPAY_NODEFAULTCHAIN: "true"
      TESTS_POSTGRES: User ID=postgres;Include Error Detail=true;Host=postgres;Port=5432;Database=btcpayserver
      TESTS_HOSTNAME: tests
      TESTS_INCONTAINER: "true"
      PLAYWRIGHT_HEADLESS: "true"
      BTCPAY_ZANO_DAEMON_URI: http://37.27.100.59:10505
      BTCPAY_ZANO_WALLET_DAEMON_URI: http://zano_wallet:11212
    depends_on:
      postgres:
        condition: service_healthy
      zano_wallet:
        condition: service_healthy
    extra_hosts:
      - "tests:127.0.0.1"
    volumes:
      - ../coverage:/coverage

  zano_wallet:
    image: pavelravaga/zano:2.2.1.502@sha256:5b2c8fbb7f5482b281318d264f7d887ca14400d4bd74cb7a7bcf3036aa443b37
    entrypoint: /bin/bash
    command:
      - -ec
      - |
        if [ ! -f /wallet/wallet ]; then
          # The interactive exit command returns 1 even after generating the wallet.
          echo exit | simplewallet --generate-new-wallet=/wallet/wallet --password=pass --daemon-address=37.27.100.59:10505 >/dev/null 2>&1 || test -s /wallet/wallet
        fi
        exec simplewallet --wallet-file=/wallet/wallet --password=pass --daemon-address=37.27.100.59:10505 --rpc-bind-ip=0.0.0.0 --rpc-bind-port=11212 --unsecure-no-auth
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -X POST http://127.0.0.1:11212/json_rpc
          -H 'Content-Type: application/json'
          -d '{"jsonrpc":"2.0","id":0,"method":"get_wallet_info"}'
          | grep -q '"address"'
      interval: 5s
      timeout: 10s
      retries: 24
    volumes:
      - zano_wallet:/wallet

  postgres:
    image: postgres:17.4
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  zano_wallet: